
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | File Integrity Monitor</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: #f5f5f5;
            background: #080a0d;
        }

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 50% 50%, #21170e 0%, #080a0d 65%);
        }

        .glow {
            position: absolute;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            background: #ff922010;
            filter: blur(90px);
            animation: glowMove 9s ease-in-out infinite alternate;
        }

        .glow.one { top: -200px; left: -150px; }
        .glow.two { bottom: -250px; right: -120px; animation-delay: -4s; }

        .grid {
            position: absolute;
            inset: 0;
            opacity: .13;
            background-image:
                linear-gradient(#ff9b3514 1px, transparent 1px),
                linear-gradient(90deg, #ff9b3514 1px, transparent 1px);
            background-size: 55px 55px;
            mask-image: linear-gradient(to bottom, black, transparent);
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #ff9b35;
            border-radius: 50%;
            box-shadow: 0 0 12px #ff9b35;
            animation: floatUp linear infinite;
        }

        .auth-card {
            position: relative;
            z-index: 2;
            width: min(100%, 470px);
            padding: 42px;
            border-radius: 20px;
            background: #12161bf2;
            border: 1px solid #40362b;
            box-shadow: 0 25px 90px #0009;
            animation: enter .8s ease both;
            transition: .3s;
        }

        .auth-card:hover {
            border-color: #a76525;
            box-shadow: 0 25px 90px #0009, 0 0 35px #ff9b3510;
        }

        .brand {
            color: #ff9b35;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2.5px;
        }

        h1 {
            margin-top: 17px;
            font-size: 31px;
        }

        .subtitle {
            margin-top: 15px;
            margin-bottom: 28px;
            color: #a5adb8;
            line-height: 1.7;
        }

        label {
            display: block;
            margin: 17px 0 9px;
            font-size: 14px;
            color: #e4e7eb;
        }

        input {
            width: 100%;
            padding: 15px;
            border-radius: 9px;
            border: 1px solid #343b43;
            background: #0a0d11;
            color: white;
            outline: none;
            transition: .25s;
        }

        input:focus {
            border-color: #ff9b35;
            box-shadow: 0 0 0 3px #ff9b3520;
        }

        button {
            width: 100%;
            margin-top: 27px;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: #ff9b35;
            color: #17120c;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: .25s;
        }

        button:hover {
            background: #ffb45f;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px #ff9b3530;
        }

        .auth-link {
            margin-top: 25px;
            text-align: center;
            color: #aeb5bd;
            font-size: 14px;
        }

        a {
            color: #ffad50;
            text-decoration: none;
        }

        a:hover { color: #ffd09c; }

        .message {
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            background: #302019;
            color: #ffb08a;
            font-size: 14px;
        }

        .message.success {
            background: #17291f;
            color: #8ce0a7;
        }

        @keyframes enter {
            from { opacity: 0; transform: translateY(25px) scale(.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes glowMove {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(80px, 50px) scale(1.2); }
        }

        @keyframes floatUp {
            from { transform: translateY(100vh); opacity: 0; }
            15% { opacity: .8; }
            85% { opacity: .5; }
            to { transform: translateY(-20vh); opacity: 0; }
        }

        @media (max-width: 500px) {
            .auth-card { padding: 28px 23px; }
            h1 { font-size: 27px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

<div class="background">
    <div class="glow one"></div>
    <div class="glow two"></div>
    <div class="grid"></div>
</div>

<main class="auth-card">

    <div class="brand">FILE INTEGRITY MONITOR</div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
        Sign in to access your secure monitoring workspace.
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="message {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="email">Email Address</label>
        <input
            id="email"
            type="email"
            name="email"
            autocomplete="email"
            required
        >

        <label for="password">Password</label>
        <input
            id="password"
            type="password"
            name="password"
            autocomplete="current-password"
            required
        >

        <button type="submit">Sign In</button>
    </form>

    <div class="auth-link">
        Don't have an account?
        <a href="{{ url_for('register') }}">Create Account</a>
    </div>

    <div class="auth-link">
        <a href="{{ url_for('home') }}">← Continue as Guest</a>
    </div>

</main>

<script>
    for (let i = 0; i < 35; i++) {
        const particle = document.createElement("span");
        particle.className = "particle";
        particle.style.left = Math.random() * 100 + "vw";
        particle.style.animationDuration = (7 + Math.random() * 12) + "s";
        particle.style.animationDelay = (Math.random() * 10) + "s";

        const size = 2 + Math.random() * 3;
        particle.style.width = size + "px";
        particle.style.height = size + "px";

        document.querySelector(".background").appendChild(particle);
    }
</script>

</body>
</html>
