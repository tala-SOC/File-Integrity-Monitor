<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Report - File Integrity Monitor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .report-card {
            background: #141A22;
            border: 1px solid #252D38;
            border-radius: 12px;
            padding: 25px;
            margin-top: 20px;
        }
        .report-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #252D38;
        }
        .report-row:last-child {
            border-bottom: none;
        }
        .hash-code {
            font-family: monospace;
            background: #10161F;
            padding: 4px 8px;
            border-radius: 4px;
            color: #F97316;
            word-break: break-all;
        }
        .print-btn {
            background: #252D38;
            color: #FFF;
            padding: 10px 20px;
            border: 1px solid #374151;
            border-radius: 6px;
            cursor: pointer;
            float: right;
        }
        .print-btn:hover { background: #374151; }
        
        @media print {
            .navbar, .print-btn, footer { display: none !important; }
            body { background: #FFF; color: #000; }
            .report-card { border: 1px solid #000; background: #FFF; color: #000; }
            .hash-code { background: #EEE; color: #000; }
        }
    </style>
</head>
<body>
    <div class="page">
        <nav class="navbar">
            <div class="logo">
                <div class="logo-box">FIM</div>
                <div class="logo-text"><h1>File Integrity Monitor</h1></div>
            </div>
        </nav>

        <main class="main-content">
            <button onclick="window.print()" class="print-btn">🖨️ Print Report</button>
            <h2 style="margin-bottom: 20px;">Analysis Report</h2>

            <div class="report-card">
                <div class="report-row">
                    <span>File Name:</span>
                    <strong>{{ filename }}</strong>
                </div>
                <div class="report-row">
                    <span>File Size:</span>
                    <strong>{{ filesize }}</strong>
                </div>
                <div class="report-row">
                    <span>SHA-256 Hash:</span>
                    <span class="hash-code">{{ file_hash }}</span>
                </div>
                <div class="report-row">
                    <span>Status:</span>
                    <strong style="color: #10B981;">Integrity Verified</strong>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
